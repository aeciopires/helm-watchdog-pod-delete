apiVersion: v1
entries:
  helm-watchdog-pod-delete:
  - annotations:
      artifacthub.io/changes: |
        - kind: changed
          description: "Requires Kubernetes >= 1.34 and is built, tested and published with Helm 4"
        - kind: changed
          description: "Default image updated to alpine/kubectl:1.37.2 (image.tag now defaults to appVersion)"
        - kind: changed
          description: "Container runs as non-root with read-only root filesystem by default (Pod Security Standards restricted)"
        - kind: added
          description: "New rbac.create value, decoupling ClusterRole/ClusterRoleBinding from serviceAccount.create"
        - kind: added
          description: "Helm test hook validating RBAC permissions (tests.enabled)"
        - kind: added
          description: "Chart published as OCI artifact in oci://ghcr.io/aeciopires/helm-charts"
        - kind: fixed
          description: "NOTES.txt referenced the wrong Deployment name"
        - kind: fixed
          description: "Watchdog did not handle SIGTERM, delaying pod termination by terminationGracePeriodSeconds"
        - kind: fixed
          description: "Rendering of empty livenessProbe/readinessProbe as null"
        - kind: fixed
          description: "ClusterRole name collision when serviceAccount.create=false"
        - kind: fixed
          description: "Watchdog could delete pods in its own namespace"
      artifacthub.io/images: |
        - name: kubectl
          image: docker.io/alpine/kubectl:1.37.2
      artifacthub.io/license: GPL-3.0
      artifacthub.io/prerelease: "false"
