# Tools used to develop, test and release this Helm chart.
#
# Install mise: https://mise.jdx.dev/getting-started.html
# Install the tools:  make install-deps   (or: mise trust && mise install)
#
# The same versions are used locally and in the CI (jdx/mise-action).
# The aqua backend verifies checksums/signatures of the downloaded binaries.
# Keep these versions updated. Reference: https://mise.jdx.dev/configuration.html

[tools]
helm = "4.3.1"
kubectl = "1.37.2"
kind = "0.33.0"
helm-docs = "1.14.2"
kubeconform = "0.8.0"
yq = "4.54.2"
argocd = "3.6.1"
# Code quality and security
shellcheck = "0.11.0"
actionlint = "1.7.12"
trivy = "0.76.2"
# Signature of the chart published in the OCI registry
cosign = "3.1.4"

[env]
# Version of the helm-unittest plugin installed by "make install-deps"
HELM_UNITTEST_VERSION = "1.2.1"
