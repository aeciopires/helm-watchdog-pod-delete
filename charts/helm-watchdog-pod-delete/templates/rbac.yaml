{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "helm-watchdog-pod-delete.fullname" . }}
  labels:
    {{- include "helm-watchdog-pod-delete.labels" . | nindent 4 }}
rules:
  {{- with .Values.watchdog.clusterRole.rules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "helm-watchdog-pod-delete.fullname" . }}-binding
  labels:
    {{- include "helm-watchdog-pod-delete.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "helm-watchdog-pod-delete.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "helm-watchdog-pod-delete.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
