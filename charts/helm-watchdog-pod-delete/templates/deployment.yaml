{{- if not .Values.watchdog.errorStatuses }}
{{- fail "watchdog.errorStatuses must not be empty (an empty regex would match and delete every pod)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm-watchdog-pod-delete.fullname" . }}
  labels:
    {{- include "helm-watchdog-pod-delete.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "helm-watchdog-pod-delete.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "helm-watchdog-pod-delete.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "helm-watchdog-pod-delete.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: watchdog
          image: {{ include "helm-watchdog-pod-delete.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # kubectl needs a writable HOME to store its discovery cache
            - name: HOME
              value: /tmp
            - name: NAMESPACES
              value: {{ .Values.watchdog.namespaces | default list | join " " | quote }}
            - name: EXCLUDE_NAMESPACES
              value: {{ include "helm-watchdog-pod-delete.excludeNamespaces" . | quote }}
            - name: CHECK_INTERVAL
              value: {{ .Values.watchdog.checkInterval | int | toString | quote }}
            - name: ERROR_STATUSES
              value: {{ .Values.watchdog.errorStatuses | quote }}
          command:
            - /bin/sh
            - -c
            - |
              log() {
                echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $*"
              }

              # Stop immediately when Kubernetes asks to terminate the pod
              trap 'log "[INFO] Termination signal received, stopping the watchdog..."; exit 0' TERM INT

              log "[INFO] Starting the watchdog..."
              log "[INFO] Namespaces: ${NAMESPACES:-<all>}"
              log "[INFO] Excluded namespaces: ${EXCLUDE_NAMESPACES}"
              log "[INFO] Error statuses: ${ERROR_STATUSES}"
              log "[INFO] Check interval: ${CHECK_INTERVAL}s"
              log "[INFO] Monitoring pods with errors..."

              # Returns 0 (true) if the namespace must be ignored
              should_exclude() {
                for ex_ns in $EXCLUDE_NAMESPACES; do
                  if [ "$1" = "$ex_ns" ]; then
                    return 0
                  fi
                done
                return 1
              }

              # Prints one line per pod: "<namespace> <pod> <status>"
              list_pods() {
                if [ -z "$NAMESPACES" ]; then
                  kubectl get pods --all-namespaces --no-headers | awk '{print $1, $2, $4}'
                else
                  for ns in $NAMESPACES; do
                    kubectl get pods --namespace "$ns" --no-headers | awk -v ns="$ns" '{print ns, $1, $3}'
                  done
                fi
              }

              while true; do
                list_pods | while read -r ns pod status; do
                  if [ -z "$pod" ] || should_exclude "$ns"; then
                    continue
                  fi
                  if echo "$status" | grep -qE "$ERROR_STATUSES"; then
                    log "[WARNING] Deleting pod: $pod in namespace: $ns (status: $status)"
                    kubectl delete pod "$pod" --namespace "$ns" --wait=false \
                      || log "[ERROR] Failed to delete pod: $pod in namespace: $ns"
                  fi
                done

                # Run sleep in background so the TERM trap is handled immediately
                sleep "$CHECK_INTERVAL" &
                wait $!
              done
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
