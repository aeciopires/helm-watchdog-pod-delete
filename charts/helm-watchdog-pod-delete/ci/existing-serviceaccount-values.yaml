# Values used by "make template" / "make kubeconform" and the CI pipeline.
# Use an existing ServiceAccount, keep RBAC and disable the helm test hook.
serviceAccount:
  create: false
  name: my-existing-sa
rbac:
  create: true
tests:
  enabled: false
fullnameOverride: watchdog
image:
  tag: "1.34.2"
