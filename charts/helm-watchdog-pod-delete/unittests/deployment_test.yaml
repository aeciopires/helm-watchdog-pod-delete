# Unit tests executed by helm-unittest (https://github.com/helm-unittest/helm-unittest)
# Run: make unittest
suite: deployment
templates:
  - templates/deployment.yaml
release:
  name: wd
  namespace: watchdog
chart:
  version: 9.9.9
  appVersion: "1.99.0"
tests:
  - it: renders a Deployment with the default values
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: wd-helm-watchdog-pod-delete
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.serviceAccountName
          value: wd-helm-watchdog-pod-delete

  - it: uses appVersion as default image tag
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: alpine/kubectl:1.99.0

  - it: uses image.tag when it is defined
    set:
      image.repository: registry.example.com/kubectl
      image.tag: "1.34.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/kubectl:1.34.0

  - it: always excludes the release namespace
    set:
      watchdog.excludeNamespaces:
        - kube-system
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXCLUDE_NAMESPACES
            value: watchdog kube-system

  - it: does not duplicate the release namespace in the exclusion list
    set:
      watchdog.excludeNamespaces:
        - watchdog
        - kube-system
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXCLUDE_NAMESPACES
            value: watchdog kube-system

  - it: monitors all namespaces by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NAMESPACES
            value: ""

  - it: monitors only the configured namespaces
    set:
      watchdog.namespaces:
        - app1
        - app2
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NAMESPACES
            value: app1 app2

  - it: passes interval and error statuses to the container
    set:
      watchdog.checkInterval: 15
      watchdog.errorStatuses: "CrashLoopBackOff|Init:Error"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHECK_INTERVAL
            value: "15"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ERROR_STATUSES
            value: CrashLoopBackOff|Init:Error

  - it: handles SIGTERM in the watchdog script
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "trap .* TERM INT"

  - it: runs as non-root with a read-only root filesystem by default
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp

  - it: does not render empty probes
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe

  - it: renders probes when they are defined
    set:
      livenessProbe:
        exec:
          command: ["true"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[0]
          value: "true"

  - it: uses an existing service account when serviceAccount.create is false
    set:
      serviceAccount.create: false
      serviceAccount.name: my-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-sa

  - it: renders scheduling options
    set:
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: dedicated
          operator: Exists
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/os"]
          value: linux
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: dedicated

  - it: fails when errorStatuses is empty
    set:
      watchdog.errorStatuses: ""
    asserts:
      - failedTemplate: {}

